[package]
name = "media-backup-mobile"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true

[lib]
crate-type = ["staticlib", "cdylib"]

[dependencies]
media-backup-client-core = { path = "../client-core" }
serde_json.workspace = true
sarmg-mobile-ffi = { git = "https://github.com/isarmg/sarmg-foundation-client.git", rev = "9bf6eec21f42188c73105eef2f369bf47c8b8f86", version = "=0.9.16" }
jni = { workspace = true, optional = true }

[features]
jni-host-tests = ["dep:jni", "sarmg-mobile-ffi/jni"]

[target.'cfg(target_os = "android")'.dependencies]
jni.workspace = true
sarmg-mobile-ffi = { git = "https://github.com/isarmg/sarmg-foundation-client.git", rev = "9bf6eec21f42188c73105eef2f369bf47c8b8f86", features = ["jni"], version = "=0.9.16" }

[dev-dependencies]
jni.workspace = true
sarmg-mobile-ffi = { git = "https://github.com/isarmg/sarmg-foundation-client.git", rev = "9bf6eec21f42188c73105eef2f369bf47c8b8f86", features = ["jni"], version = "=0.9.16" }
tempfile.workspace = true
