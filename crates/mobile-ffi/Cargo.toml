[package]
name = "media-backup-mobile"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true

[lib]
crate-type = ["staticlib", "cdylib"]

[dependencies]
media-backup-client-core = { path = "../client-core" }
serde_json.workspace = true
sarmg-mobile-ffi = { git = "https://github.com/isarmg/sarmg-foundation-client.git", rev = "eecece4b831c193f6ea3f0a24b07e435432653ad", version = "=0.7.1" }
jni = { workspace = true, optional = true }

[features]
jni-host-tests = ["dep:jni", "sarmg-mobile-ffi/jni"]

[target.'cfg(target_os = "android")'.dependencies]
jni.workspace = true
sarmg-mobile-ffi = { git = "https://github.com/isarmg/sarmg-foundation-client.git", rev = "eecece4b831c193f6ea3f0a24b07e435432653ad", features = ["jni"], version = "=0.7.1" }

[dev-dependencies]
jni.workspace = true
sarmg-mobile-ffi = { git = "https://github.com/isarmg/sarmg-foundation-client.git", rev = "eecece4b831c193f6ea3f0a24b07e435432653ad", features = ["jni"], version = "=0.7.1" }
tempfile.workspace = true
