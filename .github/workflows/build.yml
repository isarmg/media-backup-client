name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust workspace
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.98.0
          components: rustfmt,clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: ./scripts/check-mobile-v02-contract.sh
      - run: python3 scripts/test-package-ios-ipa.py
      - run: ./scripts/check-workflow-supply-chain.sh
      - run: cargo fmt --all -- --check
      - run: cargo check --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: bash scripts/test-mobile-ffi-c.sh

  android:
    name: Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.98.0
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: android
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Verify actual JNI exceptions and current ABI on the host JVM
        run: bash scripts/test-mobile-ffi-jni.sh
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        with:
          gradle-version: "9.5.0"
          cache-provider: basic
      - run: cargo install cargo-ndk --locked
      - name: Build Rust Android library
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358"
          cargo ndk -t arm64-v8a -o clients/android/app/src/main/jniLibs build -p media-backup-mobile --release
      - run: gradle -p clients/android testDebugUnitTest assembleDebug assembleDebugAndroidTest
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: media-backup-android-debug
          path: clients/android/app/build/outputs/apk/debug/*.apk

      - name: Prepare Android 16 sandbox tests
        run: |
          sdkmanager "emulator" "system-images;android-36;google_apis;x86_64"
          sudo chown "$(id -un)" /dev/kvm
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358"
          cargo ndk -t x86_64 -o clients/android/app/src/main/jniLibs build -p media-backup-mobile --release --locked
      - name: Test actual JNI backup on Android 16
        run: bash scripts/test-android-emulator.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: media-backup-android16-test-results
          path: |
            clients/android/app/build/reports/androidTests/
            clients/android/app/build/outputs/androidTest-results/
            ${{ runner.temp }}/media-backup-emulator.log

  ios:
    name: iOS unsigned IPA
    runs-on: xcode-27
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.98.0
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ios27
      - name: Verify Xcode 27 and iOS 27 SDKs
        run: bash scripts/verify-ios-toolchain.sh
      - run: brew install xcodegen
      - name: Verify Swift system directory aliases inside an Apple sandbox
        run: bash scripts/test-ios-system-directory.sh
      - name: Verify fresh login DB inside a restricted Apple sandbox
        run: bash scripts/test-mobile-ffi-c.sh
      - run: ./scripts/build-ios-rust.sh
      - run: cd clients/ios && xcodegen generate
      - name: Run iOS account and state isolation tests
        timeout-minutes: 10
        run: |
          simulator_udid="$(xcrun simctl list devices available -j | python3 -c 'import json, sys; devices = json.load(sys.stdin)["devices"]; print(next(device["udid"] for runtime, entries in devices.items() if runtime.startswith("com.apple.CoreSimulator.SimRuntime.iOS-27-") for device in entries if device["name"].startswith("iPhone") and device.get("isAvailable")))')"
          test -n "$simulator_udid"
          echo "MEDIA_BACKUP_TEST_SIMULATOR=$simulator_udid" >> "$GITHUB_ENV"
          xcodebuild -project clients/ios/MediaBackup.xcodeproj -scheme MediaBackup -sdk iphonesimulator -destination "id=$simulator_udid" CODE_SIGNING_ALLOWED=NO -derivedDataPath clients/ios/DerivedData -only-testing:MediaBackupTests -parallel-testing-enabled NO test
      - name: Run iOS login and gallery UI tests
        timeout-minutes: 12
        run: |
          bash scripts/seed-ios-ui.sh "$MEDIA_BACKUP_TEST_SIMULATOR"
          xcodebuild -project clients/ios/MediaBackup.xcodeproj -scheme MediaBackup -sdk iphonesimulator -destination "id=$MEDIA_BACKUP_TEST_SIMULATOR" CODE_SIGNING_ALLOWED=NO -derivedDataPath clients/ios/DerivedData -only-testing:MediaBackupUITests -resultBundlePath clients/ios/TestResults.xcresult -parallel-testing-enabled NO test
      - name: Export iOS UI screenshots and diagnostics
        if: always()
        run: |
          mkdir -p dist/ios-ui
          runner_data="$(xcrun simctl get_app_container "$MEDIA_BACKUP_TEST_SIMULATOR" org.sarmg.mediabackup.uitests.xctrunner data 2>/dev/null || true)"
          if test -n "$runner_data"; then
            find "$runner_data/Documents" -name '*.png' -exec cp {} dist/ios-ui/ \;
          fi
          xcrun simctl spawn "$MEDIA_BACKUP_TEST_SIMULATOR" log show --last 15m --info --debug --style compact --predicate 'subsystem == "org.sarmg.mediabackup"' > dist/ios-ui/gallery.log || true
          if test -f clients/ios/TestResults.xcresult/Info.plist; then
            xcrun xcresulttool export attachments --path clients/ios/TestResults.xcresult --output-path dist/ios-ui/attachments
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: media-backup-ios-ui
          path: dist/ios-ui/
          if-no-files-found: warn
      - name: Build without signing
        run: xcodebuild -project clients/ios/MediaBackup.xcodeproj -scheme MediaBackup -sdk iphoneos -configuration Release CODE_SIGNING_ALLOWED=NO -derivedDataPath clients/ios/DerivedData build
      - name: Package unsigned IPA
        run: |
          python3 scripts/package-ios-ipa.py \
            --app clients/ios/DerivedData/Build/Products/Release-iphoneos/MediaBackup.app \
            --version "$(cat VERSION)" \
            --output "dist/media-backup-ios-$(cat VERSION)-unsigned.ipa"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: media-backup-ios-unsigned-ipa
          path: dist/*.ipa
          if-no-files-found: error
